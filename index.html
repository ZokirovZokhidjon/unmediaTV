<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuTV Style IPTV Player</title>
    
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ЧАП ТОМОН: Каналлар рўйхати */
        .sidebar {
            width: 350px;
            background: linear-gradient(180deg, #141414 0%, #0a0a0a 100%);
            border-right: 2px solid #ef1a4a; /* RuTV ўзига хос малина ранги */
            display: flex;
            flex-direction: column;
            box-shadow: 5px 0 25px rgba(0, 0, 0, 0.7);
            z-index: 10;
        }
        .sidebar-header {
            padding: 20px;
            background-color: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
            text-align: center;
        }
        .sidebar-header h3 {
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ef1a4a, #ff5e62);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        
        /* Тезкор қидирув майдони */
        .search-box {
            padding: 10px 20px;
            background-color: #141414;
        }
        .search-box input {
            width: 100%;
            padding: 10px 15px;
            background-color: #222;
            border: 1px solid #333;
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }
        .search-box input:focus {
            border-color: #ef1a4a;
            box-shadow: 0 0 10px rgba(239, 26, 74, 0.3);
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        .channel-list::-webkit-scrollbar {
            width: 6px;
        }
        .channel-list::-webkit-scrollbar-thumb {
            background-color: #333;
            border-radius: 4px;
        }
        .channel-list::-webkit-scrollbar-thumb:hover {
            background-color: #ef1a4a;
        }

        /* Канал элементи */
        .channel-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .channel-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(4px);
        }
        .channel-item.active {
            background: linear-gradient(90deg, rgba(239, 26, 74, 0.2) 0%, rgba(0, 0, 0, 0) 100%);
            border-left: 3px solid #ef1a4a;
        }
        .channel-logo-placeholder {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            background: linear-gradient(135deg, #ef1a4a, #7b1fa2);
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }
        .channel-info {
            flex: 1;
            overflow: hidden;
        }
        .channel-name {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #e0e0e0;
        }
        .channel-item.active .channel-name {
            color: #fff;
        }

        /* ЎНГ ТОМОН: Плеер Майдони */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #070707;
            position: relative;
        }
        
        .player-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: radial-gradient(circle, #1a1a1a 0%, #070707 100%);
        }
        .player-container {
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 16/9;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(239, 26, 74, 0.15);
            position: relative;
        }

        /* VIDEO.JS ПЛЕЕРИНИНГ НЕОН УСЛУБИДАГИ СТИЛЛАРИ */
        .video-js {
            width: 100% !important;
            height: 100% !important;
            border-radius: 12px;
        }
        /* Катта "Play" тугмасини чиройли ва неон қилиш */
        .video-js .vjs-big-play-button {
            background-color: rgba(239, 26, 74, 0.8) !important;
            border: 2px solid #ef1a4a !important;
            border-radius: 50% !important;
            width: 70px !important;
            height: 70px !important;
            line-height: 66px !important;
            margin-left: -35px !important;
            margin-top: -35px !important;
            box-shadow: 0 0 20px #ef1a4a !important;
            transition: all 0.3s ease !important;
        }
        .video-js:hover .vjs-big-play-button {
            background-color: #ef1a4a !important;
            transform: scale(1.1);
            box-shadow: 0 0 30px #ff5e62 !important;
        }
        /* Пастки бошқарув панели дизайни */
        .video-js .vjs-control-bar {
            background-color: rgba(10, 10, 10, 0.85) !important;
            backdrop-filter: blur(10px);
            height: 50px !important;
        }
        /* Овоз ва бошқа юкланиш чизиқларини қизил қилиш */
        .video-js .vjs-play-progress, .video-js .vjs-volume-level {
            background-color: #ef1a4a !important;
        }
        .video-js .vjs-load-progress {
            background-color: rgba(255, 255, 255, 0.2) !important;
        }

        /* Пастки маълумотлар панели */
        .player-footer {
            padding: 25px 40px;
            background: #0f0f0f;
            border-top: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .current-meta {
            display: flex;
            align-items: center;
        }
        .current-icon {
            font-size: 24px;
            color: #ef1a4a;
            margin-right: 15px;
            animation: pulse 2s infinite;
        }
        .current-title {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .live-badge {
            background-color: #ef1a4a;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-left: 15px;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(239, 26, 74, 0.5);
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h3><i class="fa-solid fa-play current-icon"></i> UNMEDIA-TV PORTAL</h3>
        </div>
        <div class="search-box">
            <input type="text" id="searchChannel" placeholder="Канал номини ёзинг..." oninput="filterChannels()">
        </div>
        <div class="channel-list" id="channelList">
            </div>
    </div>

    <div class="main-content">
        <div class="player-wrapper">
            <div class="player-container">
                <video id="videoPlayer" class="video-js vjs-default-skin vjs-big-play-centered" controls autoplay muted preload="auto">
                    <p class="vjs-no-js">Браузерингизда JavaScript ёқилмаган.</p>
                </video>
            </div>
        </div>
        
        <div class="player-footer">
            <div class="current-meta">
                <i class="fa-solid fa-circle-play current-icon"></i>
                <div class="current-title" id="currentTrackTitle">Канал танланмади</div>
                <div class="live-badge" id="liveStatus"><i class="fa-solid fa-satellite-dish"></i> ЭФИР</div>
            </div>
        </div>
    </div>

    <script>
        // M3U Матнли Базаси
        const rawM3uData = `#EXTM3U
# Создано: 2026-05-10 08:14:38
#EXTINF:-1 ,.Red
https://a3285272783-s80718.cdn.ngenix.net/hls/CH_REDHD/video_1920x1080_avc1/playlist.m3u8
#EXTINF:-1 ,.sci-fi
https://a3569457567-s70378.cdn.ngenix.net/sony_sci_fi/2/index.m3u8
#EXTINF:-1 ,12 Канал (Омск)
http://12channel.bonus-tv.ru/cdn/12channel/playlist_sdhigh.m3u8
#EXTINF:-1 ,2x2
https://zabava-htlive.cdn.ngenix.net/hls/CH_2X2/variant.m3u8
#EXTINF:-1 ,Amedia Premium HD
https://a3569457567-s70378.cdn.ngenix.net/amedia_premium_hd/2/index.m3u8
#EXTINF:-1 ,Animal Planet HD
http://93.84.115.174:10181/animalplanethd
#EXTINF:-1 ,Bloomberg
https://bloomberg.com/media-manifest/streams/us.m3u8
#EXTINF:-1 ,Cartoon Network
http://176.118.197.101/Cartoon_Network/index.m3u8
#EXTINF:-1 ,Cinema
http://catchup.videoline.ru/cinema/playlist.m3u8
#EXTINF:-1 ,CNN International
https://turnerlive.warnermediacdn.com/hls/live/586495/cnngo/cnn_slate/VIDEO_0_3564000.m3u8
#EXTINF:-1 ,Discovery Channel
https://d24aqelmrau4kx.cloudfront.net/v1/master/3722c60a815c199d9c0ef36c5b73da68a62b09d1/cc-l1oas691aj7p2/WBTV_IT.m3u8
#EXTINF:-1 ,Eurochannel
http://cdntv.online/high/47eurvkpm6/37.m3u8
#EXTINF:-1 ,Euronews
https://stream8.cinerama.uz/1024/tracks-v1a1/mono.m3u8
#EXTINF:-1 ,Eurosport 1 HD
http://178.134.1.158:8081/eurosport/index.m3u8
#EXTINF:-1 ,Hollywood HD
https://a3569457567-s70378.cdn.ngenix.net/amc/2/index.m3u8
#EXTINF:-1 ,Nat Geo Wild HD
https://stream8.cinerama.uz/1042/tracks-v1a1/mono.m3u8
#EXTINF:-1 ,National Geographic HD
https://stream8.cinerama.uz/1041/tracks-v1a1/mono.m3u8
#EXTINF:-1 ,RU.TV
https://bl.rutube.ru/livestream/b1eb8e90d7e636677b3eb73b4fcbb717/index.m3u8?scheme=https
#EXTINF:-1 ,Setanta Sports 1
https://stream8.cinerama.uz/1263/tracks-v1a1/mono.m3u8
#EXTINF:-1 ,Viju TV1000 Action
http://80.77.52.3/streams/media/tv1000action_720x576/index.m3u8`;

        let channels = [];
        let player;

        // Плеерни саҳифа юкланганда ишга тушириш
        document.addEventListener("DOMContentLoaded", function() {
            player = videojs('videoPlayer', {
                fluid: true,
                playbackRates: [0.5, 1, 1.5, 2],
                controlBar: {
                    children: [
                        'playToggle',
                        'volumePanel',
                        'currentTimeDisplay',
                        'timeDivider',
                        'durationDisplay',
                        'progressControl',
                        'liveDisplay',
                        'fullscreenToggle'
                    ]
                }
            });

            parseM3u(rawM3uData);
        });

        // M3U парсер функцияси
        function parseM3u(data) {
            const lines = data.split('\n');
            let currentName = '';

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const parts = line.split(',');
                    if (parts.length > 1) {
                        currentName = parts[1].trim();
                    }
                } else if (line.startsWith('http') || line.startsWith('https')) {
                    if (currentName) {
                        channels.push({ name: currentName, url: line });
                    }
                }
            });
            renderChannels(channels);
        }

        // Каналларни рўйхатга чиқариш
        function renderChannels(list) {
            const container = document.getElementById('channelList');
            container.innerHTML = '';

            list.forEach((channel, index) => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                item.onclick = () => playChannel(channel.url, channel.name, item);

                const logo = document.createElement('div');
                logo.className = 'channel-logo-placeholder';
                logo.innerText = channel.name.substring(0, 2).toUpperCase();

                const info = document.createElement('div');
                info.className = 'channel-info';

                const name = document.createElement('div');
                name.className = 'channel-name';
                name.innerText = channel.name;

                info.appendChild(name);
                item.appendChild(logo);
                item.appendChild(info);
                container.appendChild(item);
            });
        }

        // Канални қўйиш ва плеерни янгилаш
        function playChannel(url, name, element) {
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            document.getElementById('currentTrackTitle').innerText = name;

            // Плеерга янги линкни бериш
            player.src({
                src: url,
                type: url.includes('.mpd') ? 'application/dash+xml' : 'application/x-mpegURL'
            });

            player.ready(function() {
                player.play().catch(function(error) {
                    console.log("Автоматик ижро блокиланди, фойдаланувчи тугмани босиши керак.");
                });
            });
        }

        // Тезкор қидирув фильтри
        function filterChannels() {
            const query = document.getElementById('searchChannel').value.toLowerCase();
            const filtered = channels.filter(c => c.name.toLowerCase().includes(query));
            renderChannels(filtered);
        }
    </script>
</body>
</html>
