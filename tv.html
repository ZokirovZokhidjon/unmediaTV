        let channels = [];
        const player = videojs('videoPlayer');
        let mediaRecorder;
        let recordedChunks = [];
        const recBtn = document.getElementById('recBtn');

        function parseM3u(data) {
            const lines = data.split('\n');
            for (let i = 0; i < lines.length - 1; i++) {
                if (lines[i].includes('#EXTINF')) {
                    channels.push({
                        name: lines[i].split(',')[1],
                        url: lines[i+1].trim()
                    });
                }
            }
        }

        function renderChannels(arr) {
            const list = document.getElementById('channelList');
            list.innerHTML = '';
            arr.forEach(ch => {
                const div = document.createElement('div');
                div.className = 'channel-item';
                div.innerText = ch.name;
                div.onclick = () => {
                    player.src({src: ch.url, type: 'application/x-mpegURL'});
                    player.play();
                    document.getElementById('currentTrackTitle').innerText = ch.name;
                };
                list.appendChild(div);
            });
        }

        recBtn.onclick = () => {
            const videoElement = document.querySelector('video');
            if (recBtn.innerText === "ЗАПИС") {
                const stream = videoElement.captureStream ? videoElement.captureStream() : videoElement.mozCaptureStream();
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'UNMEDIA_RECORD.webm';
                    a.click();
                };
                mediaRecorder.start();
                recBtn.innerText = "ТЎХТАТИШ";
                recBtn.classList.add('recording');
            } else {
                mediaRecorder.stop();
                recBtn.innerText = "ЗАПИС";
                recBtn.classList.remove('recording');
            }
        };

        function filterChannels() {
            const q = document.getElementById('searchChannel').value.toLowerCase();
            renderChannels(channels.filter(c => c.name.toLowerCase().includes(q)));
        }

        parseM3u(rawM3uData);
        renderChannels(channels);
