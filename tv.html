<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNMEDIA-TV | IPTV Portal</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0d0d0d; color: #fff; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar - Yon panel */
        .sidebar { width: 320px; background: #141414; border-right: 2px solid #ef1a4a; display: flex; flex-direction: column; transition: 0.3s; }
        .channel-list { flex: 1; overflow-y: auto; padding: 10px; }
        .channel-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #222; font-size: 14px; }
        .channel-item:hover { background: #222; }
        .channel-item.active { border-left: 4px solid #ef1a4a; background: #1f1a1d; }

        /* Asosiy kontent */
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .player-container { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; min-height: 250px; }
        .video-js { width: 100% !important; height: 100% !important; }

        /* Mobil moslashuv */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; }
            .sidebar { width: 100%; height: 40vh; border-right: none; border-bottom: 2px solid #ef1a4a; }
            .main-content { height: 60vh; }
        }

        .home { padding: 15px; text-align: center; }
        .home a { color: gold; text-decoration: none; font-weight: bold; text-shadow: 0 0 5px gold; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div style="padding: 20px; color: #ef1a4a; font-weight: bold;">UNMEDIA-TV</div>
        <div class="home"><a href="index.html">Асосий саҳифа</a></div>
        <input type="text" id="searchChannel" placeholder="Қидириш..." style="margin: 10px; padding: 10px; background: #222; color: #fff; border: none; border-radius: 5px;" oninput="filterChannels()">
        <div class="channel-list" id="channelList"></div>
    </div>

    <div class="main-content">
        <div class="player-container">
            <video id="videoPlayer" class="video-js vjs-big-play-centered" controls autoplay preload="auto"></video>
        </div>
        <div style="padding: 15px; background: #141414; font-size: 14px;" id="currentTrackTitle">Канaл танланг</div>
    </div>

    <script>
        const rawM3uData = `#EXTM3U
        #EXTINF:-1 ,.Uzb
https://telekarta-tv.ru/wp-content/uploads/uz.m3u
#EXTINF:0,Брудні танці (1987)
https://ashdi.vip/video29/1/new3/dirty_dancing_remastered_1987_3xukreng_sub.eng_bdrip_1080p_hurtom_14234/hls/1080/DauXi3CRleBCmA4=/index.m3u8
#EXTINF:0,Придорожній клуб (1989)
https://ashdi.vip/video29/2/new/road.house.1989.vinegar.syndrome.us.bdremux.1080putopia_167533/hls/1080/DauXi3CRleBCmA4=/index.m3u8`;

        let channels = [];
        const player = videojs('videoPlayer');

        function parseM3u(data) {
            const lines = data.split('\n');
            for (let i = 0; i < lines.length - 1; i++) {
                if (lines[i].includes('#EXTINF')) {
                    channels.push({
                        name: lines[i].split(',')[1],
                        url: lines[i+1].trim()
                    });
                }
            }
        }

        function renderChannels(arr) {
            const list = document.getElementById('channelList');
            list.innerHTML = '';
            arr.forEach(ch => {
                const div = document.createElement('div');
                div.className = 'channel-item';
                div.innerText = ch.name;
                div.onclick = () => {
                    player.src({src: ch.url, type: 'application/x-mpegURL'});
                    player.play();
                    document.getElementById('currentTrackTitle').innerText = ch.name;
                };
                list.appendChild(div);
            });
        }

        function filterChannels() {
            const q = document.getElementById('searchChannel').value.toLowerCase();
            renderChannels(channels.filter(c => c.name.toLowerCase().includes(q)));
        }

        parseM3u(rawM3uData);
        renderChannels(channels);
    </script>
</body>
</html>
