        let mediaRecorder;
        let recordedChunks = [];
        const player = videojs('videoPlayer');
        const recBtn = document.getElementById('recBtn');

        function loadChannels() {
            const lines = rawM3uData.split('\n');
            const channelList = document.getElementById('channelList');
            lines.forEach((line, i) => {
                if (line.startsWith('#EXTINF')) {
                    const name = line.split(',')[1];
                    const url = lines[i + 1];
                    const div = document.createElement('div');
                    div.className = 'channel-item';
                    div.innerText = name;
                    div.onclick = () => {
                        document.getElementById('currentTrackTitle').innerText = name;
                        player.src({ src: url, type: 'application/x-mpegURL' });
                        player.play();
                    };
                    channelList.appendChild(div);
                }
            });
        }

        // Запис функцияси
        recBtn.onclick = () => {
            const videoElement = document.querySelector('video');
            if (recBtn.innerText === "ЗАПИС ҚИЛИШ") {
                const stream = videoElement.captureStream ? videoElement.captureStream() : videoElement.mozCaptureStream();
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'record.webm';
                    a.click();
                };
                mediaRecorder.start();
                recBtn.innerText = "ТЎХТАТИШ";
                recBtn.classList.add('recording');
            } else {
                mediaRecorder.stop();
                recBtn.innerText = "ЗАПИС ҚИЛИШ";
                recBtn.classList.remove('recording');
            }
        };

        function filterChannels() {
            const val = document.getElementById('searchChannel').value.toLowerCase();
            document.querySelectorAll('.channel-item').forEach(item => {
                item.style.display = item.innerText.toLowerCase().includes(val) ? 'block' : 'none';
            });
        }

        loadChannels();
    </script>
